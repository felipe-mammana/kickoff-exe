
name: CD - Homologacao

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: kickoff-deploy-hml
  cancel-in-progress: false

jobs:
  deploy-hml:
    name: Deploy Homologacao
    runs-on: [self-hosted, Linux, X64, deploy]
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PHP
        run: |
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Testar rollback em ambiente isolado
        run: |
          bash -n scripts/deploy-hml-release.sh
          bash tests/deploy_hml_rollback.sh

      - name: Criar pacote da release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='config/local.php' \
            --exclude='config/crypto.local.php' \
            --exclude='config/microsoft.local.php' \
            --exclude='storage' \
            -czf /tmp/kickoff-${GITHUB_SHA}.tar.gz .

      - name: Enviar release para SRV-APP
        run: |
          scp \
            -i ~/.ssh/id_ed25519_deploy \
            -o StrictHostKeyChecking=yes \
            /tmp/kickoff-${GITHUB_SHA}.tar.gz \
            deploy@10.10.10.10:/tmp/

      - name: Publicar e validar homologacao
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_deploy \
            -o StrictHostKeyChecking=yes \
            deploy@10.10.10.10 \
            bash -s -- "${GITHUB_SHA}" \
            < scripts/deploy-hml-release.sh

      - name: Limpar pacotes temporarios
        if: always()
        run: |
          rm -f /tmp/kickoff-${GITHUB_SHA}.tar.gz
          ssh \
            -i ~/.ssh/id_ed25519_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            deploy@10.10.10.10 \
            "rm -f -- /tmp/kickoff-${GITHUB_SHA}.tar.gz" \
            || echo "AVISO: limpeza remota nao pode ser confirmada."
