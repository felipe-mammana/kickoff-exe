name: CD - Homologacao

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy-hml:
    name: Deploy Homologacao
    runs-on: [self-hosted, Linux, X64, deploy]

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Validar sintaxe PHP
        run: |
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 php -l

      - name: Criar pacote da release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='config/local.php' \
            --exclude='storage' \
            -czf /tmp/kickoff-${GITHUB_SHA}.tar.gz .

      - name: Enviar release para SRV-APP
        run: |
          scp \
            -i ~/.ssh/id_ed25519_deploy \
            -o StrictHostKeyChecking=yes \
            /tmp/kickoff-${GITHUB_SHA}.tar.gz \
            deploy@10.10.10.10:/tmp/

      - name: Publicar homologacao
        run: |
          ssh \
            -i ~/.ssh/id_ed25519_deploy \
            -o StrictHostKeyChecking=yes \
            deploy@10.10.10.10 "
              set -e

              RELEASE=/srv/projetos/kickoff/homologacao/releases/${GITHUB_SHA}

              mkdir -p \$RELEASE
              tar -xzf /tmp/kickoff-${GITHUB_SHA}.tar.gz -C \$RELEASE

              mkdir -p \$RELEASE/config

              ln -s \
                /srv/projetos/kickoff/homologacao/shared/config/local.php \
                \$RELEASE/config/local.php

              ln -s \
                /srv/projetos/kickoff/homologacao/shared/storage \
                \$RELEASE/storage

              ln -sfn \
                \$RELEASE \
                /srv/projetos/kickoff/homologacao/current

              rm -f /tmp/kickoff-${GITHUB_SHA}.tar.gz
            "

                 - name: Testar homologacao
        run: |
          sleep 2

          STATUS=$(ssh \
            -i ~/.ssh/id_ed25519_deploy \
            -o StrictHostKeyChecking=yes \
            deploy@10.10.10.10 \
            "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080")

          echo "HTTP Homologacao: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Falha no teste da homologacao"
            exit 1
          fi

      - name: Limpar pacote local
        if: always()
        run: |
          rm -f /tmp/kickoff-${GITHUB_SHA}.tar.gz